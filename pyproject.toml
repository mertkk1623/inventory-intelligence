[tool.ruff]
# Target the Python versions the project actually runs on (see CI matrix).
target-version = "py311"
line-length = 88
src = ["."]

[tool.ruff.lint]
# A deliberate, stable rule set: correctness (F, B), style consistency (E, W, I)
# and modern syntax (UP). Broader preview rules are intentionally not enabled so
# the CI gate does not change meaning between Ruff releases.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # Long lines are allowed where a URL, message or f-string reads better
    # unbroken; the codebase keeps to 88 columns everywhere else.
    "E501",
    # Streamlit pages are constructed with nested context managers on purpose;
    # collapsing them would hide which call renders into which container.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately re-import fixtures and helpers for readability.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
